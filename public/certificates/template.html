<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificate — {{STUDENT_NAME}}</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1424;
      }
      .sheet {
        position: relative;
        width: min(1123px, 96vw);
        aspect-ratio: 1024 / 723;
        background: #0b1424 url("/certificates/military-english.png") center /
          100% 100% no-repeat;
      }
      .student-name {
        position: absolute;
        left: 20.7%;
        width: 53%;
        top: 51%;
        margin: 0;
        text-align: center;
        font-family: "Palatino Linotype", Palatino, Georgia, "Times New Roman",
          serif;
        font-style: italic;
        font-size: clamp(18px, 2.8vw, 30px);
        font-weight: 600;
        color: #e4c56a;
        letter-spacing: 0.02em;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      .cert-id {
        position: absolute;
        left: 59%;
        right: 20.5%;
        top: 91.8%;
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: clamp(10px, 1vw, 11px);
        font-weight: 600;
        line-height: 1;
        color: #e4c56a;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media print {
        body {
          background: #fff;
          min-height: auto;
        }
        .sheet {
          width: 100%;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <article class="sheet" aria-label="Certificate of Completion">
      <p class="student-name">{{STUDENT_NAME}}</p>
      <p class="cert-id">{{CERTIFICATE_NUMBER}}</p>
    </article>
  </body>
</html>
